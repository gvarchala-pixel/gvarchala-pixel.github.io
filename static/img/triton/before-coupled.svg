<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#0f172a"/>

  <text x="450" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">One Service, Every Job</text>
  <text x="450" y="78" text-anchor="middle" fill="#94a3b8" font-size="15">Feature assembly, logging, and the model all scale together</text>

  <rect x="90" y="120" width="720" height="420" rx="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="450" y="150" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600">SERVING SERVICE — single deployment, single resource pool</text>

  <!-- Row 1: feature-related boxes -->
  <g font-size="14" font-weight="600" fill="#fff">
    <rect x="120" y="175" width="150" height="70" rx="10" fill="#3b82f6"/>
    <text x="195" y="205" text-anchor="middle">Feature</text>
    <text x="195" y="223" text-anchor="middle">Store Calls</text>

    <rect x="290" y="175" width="150" height="70" rx="10" fill="#3b82f6"/>
    <text x="365" y="205" text-anchor="middle">Request</text>
    <text x="365" y="223" text-anchor="middle">Features</text>

    <rect x="460" y="175" width="150" height="70" rx="10" fill="#3b82f6"/>
    <text x="535" y="205" text-anchor="middle">User Context</text>
    <text x="535" y="223" text-anchor="middle">Features</text>

    <rect x="630" y="175" width="150" height="70" rx="10" fill="#f59e0b"/>
    <text x="705" y="198" text-anchor="middle">Kafka Logging</text>
    <text x="705" y="216" text-anchor="middle">+ Metrics</text>
    <text x="705" y="234" text-anchor="middle" font-size="12" font-weight="400">(business reporting)</text>
  </g>

  <!-- Row 2: reproducibility + model -->
  <g font-size="14" font-weight="600" fill="#fff">
    <rect x="120" y="280" width="150" height="70" rx="10" fill="#f59e0b"/>
    <text x="195" y="308" text-anchor="middle">Reproducibility</text>
    <text x="195" y="326" text-anchor="middle">Sampling (~1%)</text>

    <rect x="330" y="280" width="440" height="70" rx="10" fill="#a855f7"/>
    <text x="550" y="308" text-anchor="middle" font-size="16">Model Inference</text>
    <text x="550" y="328" text-anchor="middle" font-size="12" font-weight="400">needs a GPU, everything else doesn't</text>
  </g>

  <!-- connecting lines showing tangle -->
  <g stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="195" y1="245" x2="195" y2="280"/>
    <line x1="365" y1="245" x2="400" y2="280"/>
    <line x1="535" y1="245" x2="500" y2="280"/>
    <line x1="705" y1="245" x2="650" y2="280"/>
  </g>

  <!-- overload arrow at bottom -->
  <g>
    <rect x="270" y="400" width="360" height="100" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="450" y="435" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="700">Scale the model → scale everything</text>
    <text x="450" y="458" text-anchor="middle" fill="#cbd5e1" font-size="13">GPU capacity decisions drag feature calls,</text>
    <text x="450" y="476" text-anchor="middle" fill="#cbd5e1" font-size="13">logging, and sampling along with them</text>
  </g>

  <!-- A/B testing friction note -->
  <text x="450" y="565" text-anchor="middle" fill="#94a3b8" font-size="13">Shipping a new model version means redeploying the whole service, feature logic included</text>
</svg>
