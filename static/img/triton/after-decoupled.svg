<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#0f172a"/>

  <text x="450" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">Decoupled With Triton</text>
  <text x="450" y="78" text-anchor="middle" fill="#94a3b8" font-size="15">Two deployments, two resource pools, two things that scale on their own terms</text>

  <!-- Serving layer box -->
  <rect x="60" y="130" width="380" height="400" rx="18" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <text x="250" y="158" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="600">SERVING LAYER</text>

  <g font-size="14" font-weight="600" fill="#fff">
    <rect x="90" y="180" width="320" height="60" rx="10" fill="#3b82f6"/>
    <text x="250" y="215" text-anchor="middle">Feature Store Calls</text>

    <rect x="90" y="255" width="320" height="60" rx="10" fill="#3b82f6"/>
    <text x="250" y="290" text-anchor="middle">Request + User Features</text>

    <rect x="90" y="330" width="320" height="60" rx="10" fill="#f59e0b"/>
    <text x="250" y="358" text-anchor="middle">Kafka Logging + Metrics</text>
    <text x="250" y="376" text-anchor="middle" font-size="11" font-weight="400">business reporting</text>

    <rect x="90" y="405" width="320" height="60" rx="10" fill="#f59e0b"/>
    <text x="250" y="433" text-anchor="middle">Reproducibility Sampling</text>
    <text x="250" y="451" text-anchor="middle" font-size="11" font-weight="400">~1% of feature vectors</text>
  </g>

  <text x="250" y="500" text-anchor="middle" fill="#93c5fd" font-size="13">scales on CPU, on its own schedule</text>

  <!-- Arrow -->
  <g>
    <line x1="450" y1="330" x2="560" y2="330" stroke="#e2e8f0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="505" y="315" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">gRPC / HTTP</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>

  <!-- Triton box -->
  <rect x="560" y="130" width="280" height="400" rx="18" fill="none" stroke="#22c55e" stroke-width="3"/>
  <text x="700" y="158" text-anchor="middle" fill="#86efac" font-size="15" font-weight="600">TRITON</text>

  <g font-size="14" font-weight="600" fill="#fff">
    <rect x="585" y="185" width="230" height="70" rx="10" fill="#a855f7"/>
    <text x="700" y="213" text-anchor="middle">Model Loading</text>
    <text x="700" y="231" text-anchor="middle" font-size="12" font-weight="400">+ versioning</text>

    <rect x="585" y="270" width="230" height="70" rx="10" fill="#a855f7"/>
    <text x="700" y="300" text-anchor="middle">Inference</text>
    <text x="700" y="318" text-anchor="middle" font-size="12" font-weight="400">on dedicated GPU</text>

    <rect x="585" y="355" width="230" height="70" rx="10" fill="#22c55e"/>
    <text x="700" y="383" text-anchor="middle">Audit Trail</text>
    <text x="700" y="401" text-anchor="middle" font-size="12" font-weight="400">version → prediction</text>
  </g>

  <text x="700" y="465" text-anchor="middle" fill="#86efac" font-size="13">scales on GPU, on its own schedule</text>
  <text x="700" y="485" text-anchor="middle" fill="#86efac" font-size="13">new model version = swap in Triton,</text>
  <text x="700" y="503" text-anchor="middle" fill="#86efac" font-size="13">no redeploy of the serving layer</text>
</svg>
